name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Installs Vite+, which brings Node from .node-version and pnpm from packageManager.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: 1.3.0
          cache: true
          run-install: |
            args: [--frozen-lockfile]

      - name: Create version PR or release
        uses: changesets/action@v2
        with:
          version-script: pnpm run version
          publish-script: pnpm changeset git-tag
          commit-message: "chore: version skills"
          pr-title: "chore: version skills"
